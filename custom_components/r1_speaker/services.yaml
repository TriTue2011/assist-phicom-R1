get_intercom_source:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
          domain: media_player
    ha_url:
      example: "http://ha.local:8123"
      selector:
        text:
get_wake_endpoint:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
          domain: media_player
    ha_url:
      example: "http://ha.local:8123"
      selector:
        text:
set_advanced_option:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    key:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:

set_light_function:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    function:
      required: true
      example: nghe
      selector:
        select:
          translation_key: light_function
          options: [cho, nghe, nghi, phan_hoi, dam_thoai, phat_nhac, loi, tat_mic]
    enabled:
      selector:
        boolean:
    day:
      example: '{"effect": "tho", "params": {"mau": "#0000ff", "do_sang": 60, "toc_do": 100}}'
      selector:
        object:
    vien:
      example: '{"effect": "chay_duoi", "params": {"do_sang": 60, "chieu": "xuoi"}}'
      selector:
        object:
preview_light:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    zone:
      required: true
      selector:
        select:
          options: [day, vien]
    effect:
      required: true
      example: cau_vong_xoay
      selector:
        text:
    params:
      example: '{"toc_do": 150, "chieu": "nguoc"}'
      selector:
        object:
    seconds:
      selector:
        number:
          min: 1
          max: 30
          mode: box
stop_preview_light:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
start_duplex:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
          domain: media_player
stop_duplex:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
          domain: media_player
start_conference:
  fields:
    entity_ids:
      required: true
      selector:
        entity:
          integration: r1_speaker
          multiple: true
    che_do:
      selector:
        select:
          options: [tron, quyen_noi]
    giua_cac_loa:
      selector:
        boolean:
stop_conference:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
set_main_light:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    bat:
      selector:
        boolean:
    che_do:
      selector:
        select:
          options: ["0", "1", "2", "4", "5", "6", "8", "9", "10", "11", "12", "13", "14", "15", "16"]
    sang:
      selector:
        number:
          min: 1
          max: 200
          mode: slider
    toc_do:
      selector:
        number:
          min: 1
          max: 100
          mode: slider
install_apps:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    apps:
      example: '["player", "unisound", "bodam"]'
      selector:
        object:
    force:
      selector:
        boolean:
    configure:
      selector:
        boolean:
    prepare:
      selector:
        boolean:
    reinstall:
      selector:
        boolean:

prepare_speaker:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: r1_speaker
    reboot:
      required: false
      selector:
        boolean:
